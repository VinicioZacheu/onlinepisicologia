{% extends 'base.html' %}

{% block title %}Dashboard - {{ user.name }}{% endblock %}

{% block content %}
    <h2>Welcome, {{ user.name }}</h2>

    <a href="{{ url_for('booking.psy_add_availability') }}" style="display:inline-block; margin: 10px 0; background: #4CAF50; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px;">
        ➕ Add Availability
    </a>

    <a href="{{ url_for('booking.psy_pending_bookings') }}"
        style="display:inline-block; margin: 10px 0; background: #FF9800; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px;">
        📨 View Booking Requests
    </a>

    <a href="{{ url_for('tasks.psy_add_tasks') }}"
        style="display:inline-block; margin: 10px 0; background: #3F51B5; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px;">
        📋 View & Assign Tasks
    </a>

    <a href="{{ url_for('notes.psy_notes_dashboard') }}"
        style="display:inline-block; margin: 10px 0; background: #3F51B5; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px;">
        📝 Client Notes
    </a>


    
    <div id='calendar'></div>
{% endblock %}

{% block scripts %}
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />

    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 'auto',
            events: {{ events|safe }}
        });

        calendar.render();
    });
    </script>
{% endblock %}
